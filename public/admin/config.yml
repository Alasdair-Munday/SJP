backend:
  name: github
  repo: Alasdair-Munday/SJP
  branch: main
  base_url: https://stjohnspark.church
  auth_endpoint: /.netlify/functions/auth
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1
site_url: https://stjohnspark.church
display_url: https://stjohnspark.church
publish_mode: simple
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: site_globals
    label: Site Settings
    delete: false
    files:
      - label: Site Identity
        name: site
        file: src/content/cms/site.json
        format: json
        editor:
          preview: false
        fields:
          - label: Title
            name: title
            widget: string
            required: true
          - label: Subtitle
            name: subtitle
            widget: string
            required: true
          - label: Address
            name: address
            widget: string
            required: true
          - label: Mission
            name: mission
            widget: string
            required: true
          - label: Vision
            name: vision
            widget: string
            required: true
          - label: Meta Description
            name: meta_description
            widget: string
            required: true
          - label: Default Site Url
            name: default_site_url
            widget: string
            required: true
            hint: Use a full URL (https://...) or site path (/page).
          - label: Brand
            name: brand
            widget: object
            collapsed: false
            fields:
              - label: Logo Line One
                name: logo_line_one
                widget: string
                required: true
              - label: Logo Line Two
                name: logo_line_two
                widget: string
                required: true
              - label: Nav Cta Label
