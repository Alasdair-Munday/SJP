            fields:
              - label: Label
                name: label
                widget: string
                required: true
              - label: Href
                name: href
                widget: string
                required: true
                hint: Use a full URL (https://...) or site path (/page).
              - label: Children
                name: children
                widget: list
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - label: Label
                    name: label
                    widget: string
                    required: true
                  - label: Href
                    name: href
                    widget: string
                    required: true
                    hint: Use a full URL (https://...) or site path (/page).
