  - name: news
    label: News
    folder: src/content/news
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} - {{publishDate}}"
    editor:
      preview: false
    media_folder: public/images/uploads
    public_folder: /images/uploads
    fields:
      - label: Title
        name: title
        widget: string
      - label: Summary
        name: summary
        widget: text
      - label: Publish Date
        name: publishDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Stale After Days
        name: staleAfterDays
        widget: number
        value_type: int
        min: 1
        default: 90
      - label: Primary CTA Label
        name: ctaLabel
        widget: string
        default: Learn more
      - label: Primary CTA Href
        name: ctaHref
        widget: string
        default: /contact
      - label: Secondary CTA Label
        name: secondaryCtaLabel
        widget: string
        required: false
      - label: Secondary CTA Href
        name: secondaryCtaHref
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown
