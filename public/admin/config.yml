backend:
  name: github
  repo: Alasdair-Munday/SJP
  branch: main
  base_url: https://stjohnspark.church
  auth_endpoint: /.netlify/functions/auth
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1
site_url: https://stjohnspark.church
display_url: https://stjohnspark.church
publish_mode: simple
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: site_globals
    label: Site Settings
    delete: false
    files:
      - label: Site Identity
        name: site
        file: src/content/cms/site.json
        format: json
        editor:
          preview: false
        fields:
          - label: Title
            name: title
            widget: string
          - label: Subtitle
            name: subtitle
            widget: string
          - label: Address
            name: address
            widget: string
          - label: Mission
            name: mission
            widget: string
          - label: Vision
            name: vision
            widget: string
          - label: Meta Description
            name: meta_description
            widget: string
          - label: Default Site Url
            name: default_site_url
            widget: string
          - label: Brand
            name: brand
            widget: object
            fields:
              - label: Logo Line One
                name: logo_line_one
                widget: string
              - label: Logo Line Two
                name: logo_line_two
                widget: string
              - label: Nav CTA Label
                name: nav_cta_label
                widget: string
              - label: Nav CTA Href
                name: nav_cta_href
                widget: string
      - label: Main Navigation
        name: navigation
        file: src/content/cms/navigation.json
        format: json
        editor:
          preview: false
        fields:
          - label: Items
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - label: Label
                name: label
                widget: string
              - label: Href
                name: href
                widget: string
              - label: Children
                name: children
                widget: list
                collapsed: true
                required: false
                summary: "{{fields.label}}"
                fields:
                  - label: Label
                    name: label
                    widget: string
                  - label: Href
                    name: href
                    widget: string
      - label: Footer
        name: footer
        file: src/content/cms/footer.json
        format: json
        editor:
          preview: false
        fields:
          - label: Title
            name: title
            widget: string
          - label: Quick Links
            name: quick_links
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - label: Label
                name: label
                widget: string
              - label: Href
                name: href
                widget: string
          - label: Quick Links Heading
            name: quick_links_heading
            widget: string
          - label: Background Image
            name: background_image
            widget: object
            fields:
              - label: Src
                name: src
                widget: image
              - label: Alt
                name: alt
                widget: string
                required: false
      - label: Shared Components
        name: components
        file: src/content/cms/components.json
        format: json
        editor:
          preview: false
        fields:
          - label: Calendar Events
            name: calendar_events
            widget: object
            fields:
