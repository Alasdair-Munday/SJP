[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"


[[redirects]]
  from = "/images/uploads/*"
  to = "/.netlify/functions/cdn-asset?path=images/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/profile-photos/*"
  to = "/.netlify/functions/cdn-asset?path=images/profile-photos/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[context.production.environment]
  PUBLIC_SITE_THEME = "current"

[context.deploy-preview.environment]
  PUBLIC_SITE_THEME = "current"

[context."codex/theme-garden-city".environment]
  PUBLIC_SITE_THEME = "garden-city"

[context."codex/theme-line-drawing".environment]
  PUBLIC_SITE_THEME = "line-drawing"
